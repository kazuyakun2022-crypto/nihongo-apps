# Render Blueprint: produksi (branch main) dan staging (branch dev).
# Panduan lengkap: docs/DEPLOY.md
#
# Web (Next.js) meneruskan /api/* ke API lewat rewrite di apps/web/next.config.mjs,
# jadi browser hanya bicara ke satu origin dan cookie login tetap first-party.
# Deploy otomatis baru jalan setelah CI GitHub (.github/workflows/ci.yml) hijau.
#
# Database ada di Neon (Postgres gratis tanpa kartu kredit): branch Neon `main` untuk
# produksi dan `dev` untuk staging. Database Render butuh kartu kredit atau kedaluwarsa 30 hari.

services:
  # ───────────── Produksi (main) ─────────────
  - type: web
    name: nihongo-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run db:generate -w apps/api && npm run build -w apps/api
    # Paket gratis tidak punya pre-deploy command, jadi migrasi dijalankan sebelum server start
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main/server.js
    healthCheckPath: /api/health
    buildFilter:
      paths: ["apps/api/**", "package.json", "package-lock.json"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Connection string Neon branch `main` (direct, bukan pooled), diakhiri ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # URL web produksi, mis. https://nihongo-web.onrender.com (dipakai di link email)
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: nihongo-web
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    startCommand: cd apps/web && npx next start -p $PORT
    healthCheckPath: /
    buildFilter:
      paths: ["apps/web/**", "package.json", "package-lock.json"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # URL publik API produksi, mis. https://nihongo-api.onrender.com. Dibaca saat build: ubah = deploy ulang web.
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

  # ───────────── Staging (dev) ─────────────
  - type: web
    name: nihongo-api-staging
    runtime: node
    region: singapore
    plan: free
    branch: dev
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run db:generate -w apps/api && npm run build -w apps/api
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main/server.js
    healthCheckPath: /api/health
    buildFilter:
      paths: ["apps/api/**", "package.json", "package-lock.json"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Connection string Neon branch `dev`
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: nihongo-web-staging
    runtime: node
    region: singapore
    plan: free
    branch: dev
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    startCommand: cd apps/web && npx next start -p $PORT
    healthCheckPath: /
    buildFilter:
      paths: ["apps/web/**", "package.json", "package-lock.json"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
